{% extends 'bookshelf/base.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 3rem auto 0 auto;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.75rem;
        text-align: center;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
    }

    /* Target the custom widgets class we wrote in forms.py */
    .form-input, .form-select {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 1rem;
        transition: var(--transition);
    }

    .form-input:focus, .form-select:focus {
        outline: none;
        border-color: var(--primary-accent);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
        width: 100%;
        padding: 0.8rem;
        background-color: var(--primary-accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 1rem;
    }

    .btn-submit:hover {
        background-color: #4f46e5;
    }
</style>

<div class="form-container">
    <h2 class="form-title">➕ Add New Book</h2>
    
    <!-- The Form: POST request makes it submit data to the server -->
    <form method="POST">
        <!-- 🛡️ CSRF Token: Django requires this tag inside every form. 
             It prevents malicious websites from forging form requests on your site. -->
        {% csrf_token %}
        
        <!-- We loop through each field generated by forms.py to styled them manually -->
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color: #ef4444; font-size: 0.8rem; margin-top: 0.2rem;">{{ field.errors.as_text }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn-submit">Add to Bookshelf</button>
    </form>
</div>
{% endblock %}
